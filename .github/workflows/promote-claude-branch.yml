name: Promote claude branch to main

on:
  push:
    branches: ['claude/**']

# Two pushes must not race to move main. A second run waits for the first.
concurrency:
  group: promote-to-main
  cancel-in-progress: false

# The repository default for the workflow token is read-only. `contents: write`
# lets the job push main. `actions: write` lets it start deploy.yml.
permissions:
  contents: write
  actions: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      # Fast-forwards when main has not moved, else makes a merge commit. A
      # conflict fails the job and leaves main unchanged: nobody resolves
      # conflicts here, so the branch waits for a person. The merge stays local
      # until the tests pass.
      - name: Merge branch into main
        id: merge
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          before=$(git rev-parse HEAD)
          git merge --no-edit "origin/$BRANCH"
          after=$(git rev-parse HEAD)

          if [[ "$before" == "$after" ]]; then
            echo "main already contains $BRANCH" | tee -a "$GITHUB_STEP_SUMMARY"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Tests run on the merged result, so a clash between main and the branch
      # is caught too. A red test stops the job before main moves.
      - uses: actions/setup-node@v4
        if: steps.merge.outputs.changed == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Run api tests
        if: steps.merge.outputs.changed == 'true'
        working-directory: api
        run: |
          npm ci
          npm test

      # Every node:test file under admin/ and frontend/ (tests/ folders and
      # nested ones). A red test stops the job before main moves. The
      # mcp-server tests are not run: they need their own npm ci, and their HTTP
      # server suite times out in some sandboxes.
      - name: Run admin and frontend tests
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          find admin frontend -name '*.test.js' -not -path '*/node_modules/*' -print0 \
            | xargs -0 node --test

      - name: Push main
        if: steps.merge.outputs.changed == 'true'
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git push origin main
          echo "Merged $BRANCH into main" | tee -a "$GITHUB_STEP_SUMMARY"

      # A push made with GITHUB_TOKEN never triggers the `push` trigger of
      # deploy.yml. A workflow_dispatch started with the same token does, so
      # deploy.yml must keep its workflow_dispatch trigger
      # (guide-deployment.test.js).
      - name: Start the deploy
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run deploy.yml --ref main
