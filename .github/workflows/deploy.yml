name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# One deploy at a time (issue #244). A second push waits for the running
# deploy to finish instead of starting a second deploy.sh on the VPS. The
# webhook also returns 409 while a deploy runs (api/routes/deploy-webhook.js).
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Deploy over HTTPS, not SSH: GitHub-hosted Actions runners live on
      # Azure datacenter IP ranges that get silently dropped by this VPS
      # host's network-edge protection on port 22 (see setup/Issues.md), even
      # though SSH works fine from every other network. HTTPS/443 does not
      # have this problem. This endpoint runs the identical git-reset +
      # deploy.sh sequence the old SSH step ran (api/routes/deploy-webhook.js),
      # synchronously, so this step still fails the job when the deploy fails.
      - name: Deploy via webhook
        id: webhook
        run: |
          set -euo pipefail

          http_code=$(curl -sS -w '%{http_code}' -o response.json -X POST \
            "https://thejesuswebsite.org/api/deploy-webhook" \
            -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
            --max-time 280)

          body=$(cat response.json)
          echo "$body"

          if [[ "$http_code" != "200" ]]; then
            {
              echo "❌ Deploy webhook FAILED — HTTP $http_code"
              echo "Response body: $body"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          echo "✅ Deploy webhook succeeded" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "deploy_id=$(jq -r '.deployId // empty' response.json)" >> "$GITHUB_OUTPUT"

      # The webhook replies BEFORE it restarts pm2 (the restart kills the
      # process that sends the reply), so the step above cannot see whether
      # the new processes came up. scripts/pm2-apply.js restarts them from
      # ecosystem.config.js, polls each health route for ~30s, and writes the
      # result to deploy-status.json. Poll it here and turn the job red on
      # "failed" or when no result for this deployId arrives in time.
      - name: Check restart and health
        env:
          DEPLOY_ID: ${{ steps.webhook.outputs.deploy_id }}
        run: |
          set -euo pipefail

          if [[ -z "$DEPLOY_ID" ]]; then
            echo "❌ Webhook response has no deployId" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # 30 tries x 5s = 150s: pm2 start + up to 30s health checks, with
          # room for a slow sidecar model load. While the API restarts, the
          # route returns errors; keep polling.
          for i in $(seq 1 30); do
            sleep 5
            body=$(curl -sS --max-time 10 \
              "https://thejesuswebsite.org/api/deploy-status?id=$DEPLOY_ID" \
              -H "X-Deploy-Token: ${{ secrets.DEPLOY_WEBHOOK_SECRET }}" \
              -H "Cache-Control: no-cache" 2>/dev/null || true)
            id=$(echo "$body" | jq -r '.id // empty' 2>/dev/null || true)
            state=$(echo "$body" | jq -r '.state // empty' 2>/dev/null || true)
            echo "try $i: id=${id:-none} state=${state:-none}"
            [[ "$id" == "$DEPLOY_ID" ]] || continue
            if [[ "$state" == "ok" ]]; then
              echo "✅ All processes restarted and healthy" | tee -a "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$state" == "failed" ]]; then
              {
                echo "❌ Restart or health check FAILED (see deploy-webhook.log on the VPS)"
                echo "$body"
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          done

          {
            echo "❌ No restart result for deploy $DEPLOY_ID after 150s"
            echo "Last response: ${body:-none}"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 1

      # Purge Cloudflare's edge cache so the deploy is visible immediately,
      # instead of waiting out the HTML edge cache's max-age=60 window. Must
      # run after the SSH deploy step succeeds — purging before origin serves
      # the new content would just re-cache stale bytes.
      #
      # A purge failure is EXPECTED AND INTENDED to turn the job red and
      # trigger GitHub's failure notification. The SSH deploy step above has
      # already completed and is unaffected. Do NOT add `continue-on-error:
      # true` here — that would silently swallow purge failures and reintroduce
      # the issue this step is designed to prevent (row #73 in setup/Issues.md).
      - name: Purge Cloudflare cache
        id: purge
        run: |
          set -euo pipefail

          http_code=$(curl -sS -w '%{http_code}' -o response.json -X POST \
            "https://api.cloudflare.com/client/v4/zones/${{ secrets.CLOUDFLARE_ZONE_ID }}/purge_cache" \
            -H "Authorization: Bearer ${{ secrets.CLOUDFLARE_PURGE_TOKEN }}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          body=$(cat response.json)
          echo "$body"

          # Fail visibly on non-2xx HTTP status (auth errors, rate limiting,
          # network failures, etc.).
          if [[ ! "$http_code" =~ ^2[0-9][0-9]$ ]]; then
            {
              echo "❌ Cloudflare cache purge FAILED — HTTP $http_code"
              echo "Response body: $body"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          # Parse the JSON success field explicitly. Cloudflare sometimes
          # returns HTTP 200 with {"success":false,"errors":[...]} — curl's
          # exit code alone cannot catch that case.
          if command -v jq &>/dev/null; then
            if echo "$body" | jq -e '.success == true' >/dev/null 2>&1; then
              echo "✅ Cloudflare cache purge succeeded" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              error_detail=$(echo "$body" | jq -c '.errors // "no errors array"' 2>/dev/null || echo "(unable to parse errors)")
              {
                echo "❌ Cloudflare cache purge FAILED — HTTP $http_code, success:false"
                echo "Cloudflare errors: $error_detail"
                echo "Full response: $body"
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          else
            # jq unavailable (should never happen on ubuntu-latest). Fall back
            # to a stricter grep: require "success":true present AND
            # "success":false absent.
            if echo "$body" | grep -q '"success"[[:space:]]*:[[:space:]]*true' && \
               ! echo "$body" | grep -q '"success"[[:space:]]*:[[:space:]]*false'; then
              echo "✅ Cloudflare cache purge succeeded (grep fallback)" | tee -a "$GITHUB_STEP_SUMMARY"
            else
              {
                echo "❌ Cloudflare cache purge FAILED — HTTP $http_code, success check failed"
                echo "Full response: $body"
              } | tee -a "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
          fi
